" stroke="#70916f" stroke-width="2" /><path d="M 863 112 L 870 117 L 863 122" fill="none" stroke="#70916f" stroke-width="2" /><rect x="30" y="235" width="300" height="78" rx="12" fill="#ffffff" stroke="#cbd9c6" /><text x="44" y="264" fill="#274936" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">只读派生 → 浏览器三维</text><text x="44" y="289" fill="#74826d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">可见最终零件；网格不参与评分</text><rect x="390" y="235" width="300" height="78" rx="12" fill="#ffffff" stroke="#cbd9c6" /><text x="404" y="264" fill="#274936" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">公开开发反馈 → 安全新副本</text><text x="404" y="289" fill="#74826d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">允许参数；重算与全部交付重导出</text><rect x="750" y="235" width="375" height="78" rx="12" fill="#ffffff" stroke="#cbd9c6" /><text x="764" y="264" fill="#274936" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">独立保存后核查 / 重新验收</text><text x="764" y="289" fill="#74826d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">原生参数、STEP、BOM、SVG对应同一状态</text><line x1="690" y1="274" x2="750" y2="274" stroke="#70916f" stroke-width="2" /><path d="M 743 269 L 750 274 L 743 279" fill="none" stroke="#70916f" stroke-width="2" /><text x="32" y="381" fill="#274936" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">完整本地系统：隐藏规则与生成作者隔离；首次成绩不回写；原生崩溃/超时最多一次受控重启。</text><text x="32" y="413" fill="#274936" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">公开展示版：真实工件、可交互网格、公开几何观测与通用算法；不含私有任务规则、认证或原始私有日志。</text></svg>